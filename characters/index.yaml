# 角色索引
# 新设定版。旧角色档案见 archive/legacy/characters/
# 冲突时以 ../story/SPINE.md + ../worldbuilding/ 为准

主角:
  顾生:
    file: 顾生.md
    定位: 主角，穿越医生，夹缝求生的权谋型
    金手指: 古物（三重视界，看见=暴露）

核心配角:
  古物大能:
    file: ../worldbuilding/02-被封印大能.md
    定位: 古物里被封印的存在，博弈方非盟友，全书最重要的"看不见对手+被迫盟友"
    备注: 非独立人物档，设定见worldbuilding
  赵玄机:
    file: 赵玄机.md
    定位: Arc1执行者，踹顾生下崖的人，秩序基层看门狗
  秦长老:
    file: 秦长老.md
    定位: 青玄宗秩序执行者，知道中层真相，顾生哲学镜像
  苏瑶:
    file: 苏瑶.md
    定位: 互相防备的同路人，独立线（母亲之死的新阴谋）
  方伯:
    file: 方伯.md
    定位: 凡间锚点（苍梧镇老猎户），节点②可能的牺牲者
  方远:
    file: 方远.md
    定位: 方伯之子，凡间成长线

反派类型说明:
  备注: 本书的反派不是"力量碾压型"，而是"算计型/伪装型"——顾生用看见识破，用权谋反杀。每个反派是一个阴谋故事的核心。具体反派随大纲展开补充。

