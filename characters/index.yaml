# 角色索引
# 冲突时以 ../base/spine.md + ../base/world/ 为准
# 字段说明：file = 人物档案路径，定位 = 戏剧作用，弧 = 主要出场弧次

主角:
  刘波:
    file: 刘波.md
    定位: 主角，穿越医生，夹缝求生的权谋型
    金手指: 古物（三重视界，看见=暴露）

核心配角:
  古物大能:
    file: ../base/world/02-被封印大能.md
    定位: 古物里被封印的存在，博弈方非盟友，全书最重要的"看不见对手+被迫盟友"
    备注: 非独立人物档，设定见 base/world
  顾长缨:
    file: 顾长缨.md
    定位: Arc1 执行者，踹刘波下崖的人；硬利益型阴谋家（天灵根是夺来的、炼夺根基术续命，清除名单=他的药引库）
    弧: Arc1
  沈千秋:
    file: 沈千秋.md
    定位: 万仙宗秩序执行者，夺根基术源头（传顾长缨、自己也修），知道中层真相，刘波哲学镜像+长线利益型反派
    弧: 贯穿（前段长线对手）
  宋清漪:
    file: 宋清漪.md
    定位: 互相防备的同路人，独立线（母亲之死的新阴谋）
    弧: Arc1 末 + Arc2 后 + Arc4+
  鹿啸:
    file: 鹿啸.md
    定位: 凡间锚点（沧溟镇老猎户），节点②可能的牺牲者
    弧: Arc2-4

Arc1 万仙宗配角:
  魏长宁:
    file: 魏长宁.md
    定位: 顾长缨嫡系外门执事；踹崖后下崖"补刀"=夺根基药引收取作业的现场执行者；Arc1 试刀人真身（功能代号）
    弧: Arc1
  钱小六:
    file: 钱小六.md
    定位: 杂役院杂役，被灰膜推着追刘波的"被卷进来的同类"
    弧: Arc1
  老吴头:
    file: 老吴头.md
    定位: 杂役院管事，Arc1 刘波在宗内为数不多感受到的暖
    弧: Arc1
  林阿木:
    file: 林阿木.md
    定位: 已被清除的杂役＝上个被取材的药引（ch1 具象化尸体）；刘波在伪证里"踩一脚"的死人，节点①素材
    弧: Arc1（已死）
  试刀人:
    file: arc1-试刀人.md
    定位: Arc1 反派功能代号（真身=魏长宁）；奉顾长缨之命试探/收取刘波，兼药引收取作业执行者
    弧: Arc1

沧溟镇 · 凡间锚点:
  鹿鸣:
    file: 鹿鸣.md
    定位: 鹿啸之子，凡间成长线核心，节点②的隐性传承者
    弧: Arc2-7

Arc2 沧溟卧底 cell（坏妖，杀之有理）:
  柳七:
    file: 沧溟卧底-柳七.md
    定位: 卧底 cell 头 / 阵眼。蛇妖披皮，镇东杂货铺老板
    弧: Arc2
  吴婶:
    file: 沧溟卧底-吴婶.md
    定位: 卧底 cell 处理/收尾。黄鼠狼妖披皮，镇西卖豆腐妇人
    弧: Arc2
  孟先生:
    file: 沧溟卧底-孟先生.md
    定位: 卧底 cell 转运。青丘狐杂支披皮，镇北教书先生。cell 中最有故事、最与中层真相距离最近的
    弧: Arc2 + 长线（青丘一脉伏笔）

Arc3 妖兽线 · 第一护法起源:
  团子:
    file: 团子.md
    定位: 山獾幼崽，蠢萌+奶凶+护食+点子刁。第一护法道的"灵魂"，是"拍脑袋冒充护法"的主意来源
    弧: Arc2 尾 - Arc7
  獾厚:
    file: 獾厚.md
    定位: 山獾妖父，朴实笨拙+护子+老实人的底线。第一护法道的"父亲"，是"道"的雏形的承载者
    弧: Arc2 尾 - Arc7

宋清漪独立线:
  宋清漪母亲:
    file: 宋清漪母亲.md
    定位: 宋清漪凡人母亲，已死。宋清漪独立线的源头，死因与中层真相有关
    弧: Arc2 后（背景）+ Arc4+

Arc3 凡间支线:
  鹿小满:
    file: 鹿小满.md
    定位: 沧溟镇凡人女孩，净井救疫事件的关键孩子。救苦口碑放大的"活证据"。其母陈嫂立无名牌位，是 Arc5+ 护法道场的群众基础
    弧: Arc3 + 长线

# 反派类型说明
# 本书的反派不是"力量碾压型"，而是"算计型/伪装型"——刘波用看见识破，用权谋反杀。
# 每个反派是一个阴谋故事的核心。具体反派随大纲展开补充。

