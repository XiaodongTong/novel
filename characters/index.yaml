# 角色索引
# 冲突时以 ../base/spine.md + ../base/world/ 为准
# 字段说明：file = 人物档案路径，定位 = 戏剧作用，弧 = 主要出场弧次

主角:
  顾生:
    file: 顾生.md
    定位: 主角，穿越医生，夹缝求生的权谋型
    金手指: 古物（三重视界，看见=暴露）

核心配角:
  古物大能:
    file: ../base/world/02-被封印大能.md
    定位: 古物里被封印的存在，博弈方非盟友，全书最重要的"看不见对手+被迫盟友"
    备注: 非独立人物档，设定见 base/world
  赵玄机:
    file: 赵玄机.md
    定位: Arc1 执行者，踹顾生下崖的人，秩序基层看门狗
    弧: Arc1
  秦长老:
    file: 秦长老.md
    定位: 青玄宗秩序执行者，知道中层真相，顾生哲学镜像
    弧: 贯穿（前段长线对手）
  苏瑶:
    file: 苏瑶.md
    定位: 互相防备的同路人，独立线（母亲之死的新阴谋）
    弧: Arc1 末 + Arc2 后 + Arc4+
  方伯:
    file: 方伯.md
    定位: 凡间锚点（苍梧镇老猎户），节点②可能的牺牲者
    弧: Arc2-4

Arc1 青玄宗配角:
  周元庆:
    file: 周元庆.md
    定位: 赵玄机嫡系外门执事，踹崖后下崖补刀的人
    弧: Arc1
  王二麻:
    file: 王二麻.md
    定位: 杂役院杂役，被灰膜推着追顾生的"被卷进来的同类"
    弧: Arc1
  老孙头:
    file: 老孙头.md
    定位: 杂役院管事，Arc1 顾生在宗内为数不多感受到的暖
    弧: Arc1
  林小山:
    file: 林小山.md
    定位: 已被清除的杂役，顾生在伪证里"踩一脚"的死人，节点①素材
    弧: Arc1（已死）
  试刀人:
    file: arc1-试刀人.md
    定位: Arc1 反派，奉赵玄机之命来试探/处理顾生的人
    弧: Arc1

苍梧镇 · 凡间锚点:
  方远:
    file: 方远.md
    定位: 方伯之子，凡间成长线核心，节点②的隐性传承者
    弧: Arc2-7

Arc2 苍梧卧底 cell（坏妖，杀之有理）:
  周三:
    file: 苍梧卧底-周三.md
    定位: 卧底 cell 头 / 阵眼。蛇妖披皮，镇东杂货铺老板
    弧: Arc2
  陈婶:
    file: 苍梧卧底-陈婶.md
    定位: 卧底 cell 处理/收尾。黄鼠狼妖披皮，镇西卖豆腐妇人
    弧: Arc2
  李先生:
    file: 苍梧卧底-李先生.md
    定位: 卧底 cell 转运。青丘狐杂支披皮，镇北教书先生。cell 中最有故事、最与中层真相距离最近的
    弧: Arc2 + 长线（青丘一脉伏笔）

Arc3 妖兽线 · 第一护法起源:
  獾团:
    file: 獾团.md
    定位: 山獾幼崽，蠢萌+奶凶+护食+点子刁。第一护法道的"灵魂"，是"拍脑袋冒充护法"的主意来源
    弧: Arc2 尾 - Arc7
  獾吉:
    file: 獾吉.md
    定位: 山獾妖父，朴实笨拙+护子+老实人的底线。第一护法道的"父亲"，是"道"的雏形的承载者
    弧: Arc2 尾 - Arc7

苏瑶独立线:
  苏瑶母亲:
    file: 苏瑶母亲.md
    定位: 苏瑶凡人母亲，已死。苏瑶独立线的源头，死因与中层真相有关
    弧: Arc2 后（背景）+ Arc4+

Arc3 凡间支线:
  周小满:
    file: 周小满.md
    定位: 苍梧镇凡人女孩，净井救疫事件的关键孩子。救苦口碑放大的"活证据"。其母王嫂立无名牌位，是 Arc5+ 护法道场的群众基础
    弧: Arc3 + 长线

# 反派类型说明
# 本书的反派不是"力量碾压型"，而是"算计型/伪装型"——顾生用看见识破，用权谋反杀。
# 每个反派是一个阴谋故事的核心。具体反派随大纲展开补充。

# 待补充配角（按大纲需要新建）
# Arc3-4 暗线（凡间盘剥/猎杀阴谋）的执行者：Arc3 末-Arc4 设计
# Arc4 宗门高层阴谋链人物：Arc4 设计
# 追查"异常看见者"的高层：Arc5 头设计
# Arc5 来投的护法妖（建议 1-2 只有记忆点的，延续蠢萌/各有怪癖）：Arc5 写时再设计
# Arc6 大能博弈中具体提的"条件"相关人物/地点：Arc6 设计
# 血煞堂新定位（若 Arc4+ 启用）：Arc4+ 设计