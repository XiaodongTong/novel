      反派动机：玄刚长老动机清晰（"三千年的传统你一句话就改了？"——害怕三千年的信仰被证明是错的，害怕两千年的修炼被否定）；玄明子不是反派而是温和改革者（"九十九道裂缝"的揭示让他有了自己的觉醒弧线）。本章中"反派"概念已被消解，旧秩序的崩塌更多是政治性的而非道德性的，这是全书"芸芸众生才是修仙界基石"主题的合理延伸。

