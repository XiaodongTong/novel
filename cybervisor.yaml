# For guidance on editing this file, run: `cybervisor docs cybervisor.yaml`
# 修仙小说创作流水线 — 一次任务产出约 300 章

stages:
  - name: Generate Outline
    prompt_template: |
      你是一位资深网文策划编辑，擅长长篇玄幻修仙小说的大纲设计。

      基础设定（人工维护，不可修改）：
      - `outline/premise.md` — 故事前提与核心冲突
      - `outline/world.md` — 世界观设定

      任务要求：
      > {objective}

      本阶段分批生成 300 章大纲，每批 50 章。请按以下步骤执行：

      第一步 — 确定批次进度
      - 读取 `output/summaries/outline-progress.md`，确定下一批起始章节号 N
      - 如果文件不存在，则 N = 1（这是第一批）
      - 本批写第 N 到 N+49 章

      第二步 — 第一批特有任务（仅 N=1 时执行）
      - 在 `output/summaries/plot.md` 顶部写入总体结构概览：卷/幕划分、每卷起承转合、主角修为总进度、关键转折点列表
      - 总体结构只需写一次，后续批次不再重复

      第三步 — 生成本批 50 章大纲
      - 如果 N > 1，先读取 `output/summaries/plot.md` 已有内容和 `outline-tracking.md`，确保本批与前文衔接
      - 在 `output/summaries/plot.md` 末尾追加本批 50 章的详细大纲
      - 每章包含：章节号、标题、核心事件（2-4 句话概括）、涉及主要人物、情绪基调
      - 标注本批中的关键转折点（如有）

      第四步 — 更新追踪表
      - 更新 `output/summaries/outline-tracking.md`：
        - 伏笔线索追踪表：新增伏笔、标注本批回收的伏笔
        - 主角修为进度表：本批每 10 章的境界/实力变化
      - 更新 `output/summaries/outline-progress.md`：记录已完成章节范围、当前批次号

      大纲质量要求：
      - 节奏张弛有度，每 5-8 章设置一个小高潮，每 25-30 章设置一个大转折
      - 章末留钩子，保持阅读驱动力
      - 感情线自然穿插，不抢主线
      - 配角有独立弧光，不是工具人
      - 伏笔有埋有收，前后呼应
      - 符合 CLAUDE.md 中的风格要求和禁忌事项
    contract:
      fields:
        Batch Info:
          description: 本批生成的章节范围和进度。
          example: "第 1-50 章（批次 1/6），累计 50/300 章"
        New Foreshadowing:
          description: 本批新增的伏笔线索。
          example: "第 12 章：主角在药园发现一块残破玉简；第 38 章：宗门密室中听到关于'上古禁术'的对话"
      routes:
        BATCH_DONE:
          description: 本批 50 章已完成，但尚未写满 300 章，需要继续下一批。
          next_stage: Generate Outline
        COMPLETE:
          description: 300 章大纲全部完成，可以进入审查阶段。
          next_stage: Review Outline
    cleanup:
      - .cybervisor/backups
      - .cybervisor/logs/stages
      - .tmp
    keep_artifacts:
      - output/summaries/outline-progress.md
      - output/summaries/outline-tracking.md
    backup_artifacts:
      - output/summaries/plot.md
    read_only_paths:
      - "outline/premise.md"
      - "outline/world.md"
      - "CLAUDE.md"
    max_retries: 3
    max_iterations: 6
    max_iterations_next_stage: Review Outline

  - name: Review Outline
    prompt_template: |
      你是一位资深网文主编，负责审查故事大纲的质量。

      请审查 `output/summaries/plot.md`（300 章完整大纲），对照以下素材：
      - `outline/premise.md` — 故事前提
      - `outline/world.md` — 世界观设定
      - `CLAUDE.md` — 写作风格要求和禁忌

      审查维度：
      - **主题一致性**：大纲是否贯穿核心立意"芸芸众生才是修仙界基石"
      - **节奏把控**：高潮分布是否合理，是否有拖沓或过于密集的区域
      - **角色弧光**：主要角色的成长转变是否自然、有说服力
      - **伏笔网络**：暗线是否完整（有埋有收），是否有时机不当
      - **世界观一致**：修炼体系、灵根设定等是否前后一致
      - **禁忌检查**：是否存在 CLAUDE.md 中禁止的情节模式
      - **读者体验**：钩子设置是否有效，爽点分布是否合理

      如果需要修改，直接编辑 `output/summaries/plot.md`。
      如果修改涉及伏笔或修为进度，同步更新 `output/summaries/outline-tracking.md`。
      保留合理的部分，只修改有问题的地方，不要大段重写。
    contract:
      fields:
        Findings:
          description: 大纲中发现的具体问题。
          example: |
            - 第 15-22 章节奏拖沓，连续日常缺乏冲突驱动
            - 女主角在第 40 章后突然消失，直到第 78 章才重新出现
            - 主角在第 55 章的实力提升缺乏铺垫
        Required Changes:
          description: 需要修改的具体内容。
          example: |
            - 第 18-20 章需插入一个小型危机事件
            - 补充女主角在第 40-78 章之间的支线活动
        Outline Mismatch:
          description: 大纲与核心设定不符的原因。
      routes:
        APPROVED:
          description: 大纲质量达标，可以进入人物设定阶段。
          next_stage: Design Characters
        CHANGES_MADE:
          description: 本次审查修改了大纲，需要再次审查。
          next_stage: Review Outline
        FUNDAMENTAL_ISSUE:
          description: 大纲存在根本性问题，需要重新生成。
          next_stage: Generate Outline
          injections: [Outline Mismatch, Required Changes]
    backup_artifacts:
      - output/summaries/plot.md
    read_only_paths:
      - "outline/premise.md"
      - "outline/world.md"
      - "CLAUDE.md"
    max_retries: 3
    max_iterations: 3
    max_iterations_next_stage: Design Characters

  - name: Design Characters
    prompt_template: |
      你是一位擅长角色塑造的小说创作顾问。

      请基于已通过审查的大纲（`output/summaries/plot.md`）和现有素材，为故事中所有重要角色创建详细的人物档案。

      现有素材：
      - `output/meta/characters/protagonist.md` — 主角已有档案，可补充完善
      - `outline/world.md` — 世界观设定
      - `output/summaries/plot.md` — 300 章大纲

      任务要求：
      > {objective}

      请在 `output/meta/characters/` 目录下为每个重要角色创建档案文件，包含：
      - 基本信息（姓名、年龄、灵根、修为、外貌特征）
      - 性格特征（表层性格 vs 内核性格，用具体行为模式描述而非形容词堆砌）
      - 说话风格（口头禅、句式习惯、语气特征，给出 2-3 句典型台词示例）
      - 人物关系网（与其他角色的关系和态度）
      - 完整角色弧光（在大纲中从第 X 章到第 Y 章的变化轨迹）
      - 关键决策点（在第几章面临什么选择，为什么做出那个选择）
      - 独特标签（让读者一眼就能认出这个角色的特征）

      角色创建原则：
      - 每个角色都有自己的欲望和动机，不是为主角服务的工具人
      - 反派也要有立场和逻辑，不是为了坏而坏
      - 配角的性格要和主角形成对比或互补
      - 说话风格要有辨识度，不同角色不能一个腔调
    keep_artifacts:
      - output/summaries/plot.md
    read_only_paths:
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3
    next_stage: Review Characters

  - name: Review Characters
    prompt_template: |
      你是一位角色设计评审专家。

      请审查 `output/meta/characters/` 目录下的所有角色档案，对照：
      - `output/summaries/plot.md` — 300 章大纲
      - `outline/world.md` — 世界观设定
      - `CLAUDE.md` — 写作要求

      审查维度：
      - **角色覆盖**：大纲中出场的重要角色是否都有档案
      - **性格一致**：角色弧光中的转变是否有足够的情感驱动
      - **对话辨识度**：不同角色的说话风格是否真的不同
      - **关系网络**：角色之间的关系是否合理、有张力
      - **反派深度**：反派是否有自己的立场和逻辑
      - **命名质量**：名字是否符合修仙世界风格

      如果需要修改，直接编辑对应角色文件。
      保留合理的部分，只修改有问题的地方。
    contract:
      fields:
        Findings:
          description: 角色设定中发现的具体问题。
        Required Changes:
          description: 需要修改的具体内容。
      routes:
        APPROVED:
          description: 角色设定完善，可以进入剧情推演阶段。
          next_stage: Simulate Plot
        CHANGES_MADE:
          description: 本次审查修改了角色设定，需要再次审查。
          next_stage: Review Characters
    backup_artifacts:
      - output/meta/characters/**/*.md
    keep_artifacts:
      - output/summaries/plot.md
    read_only_paths:
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3
    max_iterations: 3
    max_iterations_next_stage: Simulate Plot

  - name: Simulate Plot
    prompt_template: |
      你是一位剧情推演导演，需要利用 subagent 模拟关键剧情节点的角色行为。

      基于以下材料：
      - `output/summaries/plot.md` — 300 章大纲
      - `output/meta/characters/` — 所有角色档案

      任务要求：
      > {objective}

      推演方式：对大纲中的每个关键转折点（大约 10-15 个），进行角色行为推演：

      对每个关键节点，推演并记录：
      1. **情境设定**：此时的时间、地点、在场角色、前情概要
      2. **角色动机分析**：每个在场角色此刻最想要什么、最害怕什么
      3. **行为推演**：基于角色性格和动机，他们最可能做什么选择
      4. **冲突升级路径**：矛盾如何升级，是否有意料之外的转折
      5. **情感走向**：场景的情绪曲线（压抑→爆发→释放 等）
      6. **对话预演**：关键对话的草稿，确保角色说话风格符合档案设定

      将推演结果写入 `output/summaries/plot-simulation.md`。

      推演原则：
      - 角色的选择必须符合其性格档案，不能为了剧情需要而 OOC
      - 如果推演结果与大纲冲突，记录冲突点和调整建议
      - 特别注意群戏场景（多人同时在场的冲突），每个角色都要有独立反应
      - 推演不是写正文，重点是"为什么这么做"的逻辑链
    keep_artifacts:
      - output/summaries/plot.md
    read_only_paths:
      - "output/meta/characters/**"
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3
    next_stage: Review Plot Simulation

  - name: Review Plot Simulation
    prompt_template: |
      你是一位剧情逻辑审查员，负责检查推演结果与大纲的一致性。

      请审查 `output/summaries/plot-simulation.md`，对照：
      - `output/summaries/plot.md` — 300 章大纲
      - `output/meta/characters/` — 角色档案

      审查维度：
      - **大纲一致性**：推演结果是否与大纲中的关键事件一致
      - **角色一致性**：角色行为是否符合其档案中的性格设定
      - **逻辑自洽**：每个角色做出选择的理由是否充分
      - **冲突质量**：关键冲突是否有足够的张力和爆发力
      - **情感合理性**：情绪变化是否有足够的铺垫

      如果推演结果与大纲存在合理冲突（角色性格导致大纲中的情节不太可能发生），
      记录冲突并给出调整建议。可以修改大纲以适应更合理的角色行为。

      将审查意见写入 `output/review/simulation-review.md`。
      如果需要修改大纲，直接编辑 `output/summaries/plot.md`。
    contract:
      fields:
        Findings:
          description: 推演中发现的角色行为问题或大纲冲突。
        Required Changes:
          description: 需要调整大纲或补充推演的具体内容。
        Simulation Mismatch:
          description: 推演结果与大纲的根本性冲突说明。
      routes:
        APPROVED:
          description: 推演结果与大纲一致，角色行为合理，可以开始写正文。
          next_stage: Write Chapter
        CHANGES_MADE:
          description: 本次审查修改了大纲或标记了需要重新推演的节点。
          next_stage: Simulate Plot
          injections: [Findings, Required Changes]
        FUNDAMENTAL_ISSUE:
          description: 角色设定与大纲存在根本性矛盾，需要回退到人物设定阶段。
          next_stage: Design Characters
          injections: [Simulation Mismatch, Required Changes]
    backup_artifacts:
      - output/summaries/plot.md
      - output/summaries/plot-simulation.md
    keep_artifacts:
      - output/summaries/plot.md
      - output/summaries/plot-simulation.md
    read_only_paths:
      - "output/meta/characters/**"
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3
    max_iterations: 2
    max_iterations_next_stage: Write Chapter

  - name: Write Chapter
    prompt_template: |
      你是一位顶级网文作家，风格对标天蚕土豆和辰东。

      请基于以下材料撰写正文：
      - `output/summaries/plot.md` — 300 章大纲（每章核心事件）
      - `output/summaries/plot-simulation.md` — 关键节点推演
      - `output/summaries/writing-progress.md` — 写作进度（确定起始章节编号）
      - `output/meta/foreshadow/foreshadowing.md` — 伏笔与坑位追踪表
      - `outline/world.md` — 世界观设定（修炼体系、地理等）
      - `CLAUDE.md` — 写作风格要求和禁忌

      任务要求：
      > {objective}

      核心规则：每次写 3 章（最后一批可能不足 3 章）。具体步骤：

      第零步 — 归档上一批次
      - 如果 N > 1（非第一批），将以下会被覆盖的文件复制到 `workspace/archive/batch-上一批次号/` 目录下保留：
        - `output/meta/characters/character-brief.md`
        - `output/summaries/writing-progress.md`
        - `output/review/chapter-review.md`（如果存在）
      - 批次号计算：上一批最后章节号 ÷ 3（向上取整），例如上一批写了第4-6章，批次号为2
      - 如果 archive 子目录已存在则跳过，不要重复归档

      第一步 — 确定进度
      - 读取 `output/summaries/writing-progress.md`，确定起始章节编号 N
      - 如果 writing-progress.md 不存在，则 N = 1
      - 本批次写第 N, N+1, N+2 章（如果 N+2 > 300，则写到第 300 章为止）

      第二步 — 出场人物准备
      - 阅读大纲中第 N 到 N+2 章的内容，确定本批次涉及的所有出场人物
      - 读取 `output/meta/characters/` 目录中对应角色的档案
      - 为每个出场人物撰写人物小传（200-400字），包含：当前状态、近期经历、此刻心理、与本批次事件的利害关系
      - 将所有人物小传写入 `output/meta/characters/character-brief.md`

      第三步 — 伏笔检查
      - 读取 `output/meta/foreshadow/foreshadowing.md`，确认当前有哪些未回收的伏笔
      - 检查本批次章节中是否需要回收某些伏笔，如果有则在写作中自然回收
      - 回收后将 foreshadowing.md 中对应条目状态更新为"已回收"

      第四步 — 写作
      - 如果 N > 1，快速回顾第 N-1 章末尾内容，确保衔接自然
      - 如果本批次涉及关键转折点，参考 plot-simulation.md 中对应的推演结果
      - 依次撰写本批次 3 章

      硬性字数要求：
      - 每章不少于 2500 字（中文字符数，不含标题和空行）
      - 如果写完不足 2500 字，必须继续扩充内容，不得偷工减料

      文件存储规则：
      - 每章单独一个文件，存放于 `output/chapters/` 目录下
      - 文件名格式：`第序号章 标题.md`，例如 `第1章 凡尘如蚁.md`、`第10章 剑气长城.md`
      - 序号使用阿拉伯数字，不加前导零
      - 标题取自大纲 `output/summaries/plot.md` 中对应章节的标题

      第五步 — 收尾
      - 更新 `output/summaries/writing-progress.md`：已完成章节编号、各章字数、累计总字数、当前卷
      - 将本批次新埋的伏笔、钩子、坑追加到 `output/meta/foreshadow/foreshadowing.md`，格式：章节号 | 伏笔内容 | 预计回收章节 | 状态（待回收）

      写作风格要求（严格遵守）：
      - 行文大气磅礴，善用排比和对仗营造气势
      - 战斗场面热血燃爆，招式描写华丽有画面感
      - 日常场景细腻入微，情感描写真挚动人
      - 适当穿插幽默，但不过度，保持庄重感
      - 对话要有辨识度，严格参照角色档案和本次人物小传中的说话风格
      - 章节末尾留悬念钩子
      - 每次主角突破要有情感驱动，不是无理由升级
      - 不要写成龙傲天式升级流
      - 不要出现逻辑漏洞
    contract:
      fields:
        Chapters Written:
          description: 本次撰写的章节范围和各章字数。
          example: "第 1-3 章，分别为 3200/4300/3800 字"
        Current Progress:
          description: 当前进度。
          example: "已完成 3/300 章，累计 11100 字"
        New Foreshadowing:
          description: 本批次新埋的伏笔。
          example: "第 2 章：主角捡到的残页上有模糊字迹（预计第 15 章回收）"
      routes:
        BATCH_DONE:
          description: 本批次写作完成，路由到审查阶段。
          next_stage: Review Chapter
        WRITE_FAILED:
          description: 本批次写作失败，需要重新尝试。
          next_stage: Write Chapter
    keep_artifacts:
      - output/summaries/plot.md
      - output/summaries/plot-simulation.md
      - output/summaries/writing-progress.md
      - output/meta/characters/character-brief.md
    read_only_paths:
      - "output/meta/characters/**"
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3

  - name: Review Chapter
    prompt_template: |
      你是一位网文资深编辑，负责审查最新完成的章节批次。

      请审查刚写完的本批次章节（通过 `output/summaries/writing-progress.md` 确认最新章节范围），对照以下材料：
      - `output/summaries/plot.md` — 300 章大纲
      - `output/summaries/plot-simulation.md` — 关键节点推演
      - `output/meta/characters/character-brief.md` — 本批次人物小传
      - `output/meta/characters/` — 角色完整档案
      - `output/meta/foreshadow/foreshadowing.md` — 伏笔追踪表
      - `CLAUDE.md` — 写作要求

      只审查本批次最新 3 章，不审查历史章节。

      审查维度：
      - **大纲符合度**：本批次核心事件是否按大纲推进
      - **角色一致性**：对话和行为是否符合角色档案和人物小传，有无 OOC
      - **文风质量**：是否符合天蚕土豆/辰东风格
      - **字数达标**：每章不少于 2500 字（中文字符数，不含标题和空行）
      - **前文衔接**：与上一批次末尾是否衔接自然
      - **钩子检查**：每章结尾是否有有效悬念
      - **伏笔一致**：本批次声称回收的伏笔是否真的回收，新埋的伏笔记录是否准确
      - **禁忌检查**：是否违反 CLAUDE.md 中的禁忌事项

      硬性条件检查（在给出路由结论前必须执行）：
      - 读取 `output/summaries/writing-progress.md`，确认当前已完成的总章数
      - 如果总章数 < 300，路由必须选择 APPROVED_AND_CONTINUE（即使本批次质量达标，也不能选 APPROVED_AND_COMPLETE）
      - 只有当总章数 >= 300 时，才可以选择 APPROVED_AND_COMPLETE 进入 Verify 阶段

      如果发现可修复的问题，直接编辑章节文件进行修正。
      如果修正后影响了 foreshadowing.md 中的记录，同步更新。
      将审查结果追加到 `output/review/chapter-review.md`。
    contract:
      fields:
        Chapters:
          description: 本次审查的章节范围。
        Findings:
          description: 本批次发现的具体问题。
        Required Changes:
          description: 需要修改或重写的内容。
      routes:
        APPROVED_AND_CONTINUE:
          description: 本批次质量达标且尚未写满 300 章，路由回写作阶段写下 3 章。
          next_stage: Write Chapter
        APPROVED_AND_COMPLETE:
          description: 本批次质量达标且已写满 300 章，全部正文写作完成。
        NEEDS_REWRITE:
          description: 本批次存在质量问题，需要重写。
          next_stage: Write Chapter
          injections: [Findings, Required Changes]
    backup_artifacts:
      - output/chapters/**/*.md
      - output/meta/foreshadow/foreshadowing.md
    keep_artifacts:
      - output/summaries/plot.md
      - output/summaries/plot-simulation.md
      - output/summaries/writing-progress.md
      - output/meta/characters/character-brief.md
      - output/review/chapter-review.md
    read_only_paths:
      - "output/meta/characters/**"
      - "outline/**"
      - "output/summaries/**"
      - "CLAUDE.md"
    max_retries: 3

